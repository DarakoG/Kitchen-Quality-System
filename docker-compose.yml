# Kitchen Quality System - Docker Compose
# Production-ready configuration

services:
  kqs-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kqs-kitchen-quality-system
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/kqs.db
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-your-secret-key-change-in-production}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
    volumes:
      # Persist SQLite database
      - kqs-data:/app/data
      # Persist logs (optional)
      - kqs-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - kqs-network

  # Optional: Backup service
  kqs-backup:
    image: alpine:latest
    container_name: kqs-backup
    restart: unless-stopped
    volumes:
      - kqs-data:/data
      - ./backups:/backups
    entrypoint: |
      sh -c '
        while true; do
          TIMESTAMP=$$(date +%Y%m%d_%H%M%S)
          cp /data/kqs.db /backups/kqs_backup_$$TIMESTAMP.db
          echo "Backup created: kqs_backup_$$TIMESTAMP.db"
          # Keep only last 7 backups
          cd /backups && ls -t | tail -n +8 | xargs -r rm
          sleep 86400
        done
      '
    networks:
      - kqs-network

volumes:
  kqs-data:
    driver: local
  kqs-logs:
    driver: local

networks:
  kqs-network:
    driver: bridge
